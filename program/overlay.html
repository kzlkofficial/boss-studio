<style>
:root{color-scheme:dark;--gold:#e8c18a;--red:#cb3a56}*{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;overflow:hidden;background:transparent;font-family:'Segoe UI',Arial,sans-serif;color:#f9f0df}#shell{position:absolute;width:3000px;height:3000px;overflow:hidden;left:50%;top:50%;transform-origin:center center;pointer-events:none}#boss,#bossGhost{position:absolute;height:74%;width:54%;object-fit:contain;left:23%;bottom:11%;transform-origin:bottom center;filter:drop-shadow(0 16px 18px #000a);transition:filter .12s}#bossGhost{opacity:0;pointer-events:none}#heading{display:contents}#bossname{position:absolute;top:2%;left:15%;width:70%;text-align:center;text-shadow:2px 4px 7px #000;font:bold 46px Georgia,serif;letter-spacing:.03em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#meta{position:absolute;text-align:center;font:15px 'Segoe UI',sans-serif;color:#dcc79e;margin-top:8px;letter-spacing:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#health{position:absolute;left:24%;bottom:5%;width:52%;height:32px;border:2px solid #d9ab6c;background:#1b0f17e8;box-shadow:0 6px 20px #0009;border-radius:9px;overflow:hidden}#hpbar{height:100%;width:100%;background:linear-gradient(90deg,#7f1638,#e45a67);transition:width .35s}#hptext{position:absolute;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:bold 18px Arial;line-height:29px;text-shadow:1px 2px 3px #000}#armor{position:absolute;bottom:9%;left:24%;color:#b7d6e7;font:bold 17px Segoe UI;text-shadow:2px 2px #000}#top{position:absolute;right:2%;top:35%;width:20%;font-size:17px;background:#18171cc9;border:1px solid #807054;border-radius:12px;padding:95px 16px 16px;box-shadow:0 8px 22px #0008;max-height:100%;overflow:hidden}#topTitle{position:absolute;color:var(--gold);font:bold 34px Segoe UI;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#top .score{display:grid;grid-template-columns:minmax(0,70%) minmax(0,30%);gap:0;margin:8px 0}#top .score span,#top .score b{width:100%;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#top .score b{text-align:right}#notice{position:absolute;left:27%;width:46%;top:20%;text-align:center;font:700 29px Georgia;text-shadow:0 4px 8px #000;min-height:38px}#toast{z-index:150;position:absolute;left:50%;top:20%;transform:translateX(-50%);min-width:350px;background:#1c161dea;border:1px solid #e7b768;border-radius:12px;padding:20px 32px;text-align:center;font:bold 26px Georgia;opacity:0;transition:opacity .25s;box-shadow:0 7px 45px #0008}#damage{z-index:150;position:absolute;left:50%;top:50%;color:#ffe0b0;font:bold 56px Georgia;text-shadow:2px 5px 5px #000;opacity:0}#connection{z-index:160;position:absolute;left:18px;bottom:12px;font:12px monospace;color:#b8aea6;opacity:.7}.hurt{animation:hurt var(--hurt-duration,350ms) ease-in-out}.phase{animation:phase var(--phase-duration,1900ms) ease-in-out}.death-fade{animation:deathFade var(--death-fade,1100ms) ease-in forwards}.spawn{animation:spawn var(--spawn-duration,900ms) ease-out both}.damage{animation:damage 1.15s ease-out}.is-hidden{display:none!important}@keyframes hurt{0%,100%{transform:translateX(0)}30%{transform:translateX(-15px);filter:drop-shadow(0 0 25px #ff3355)}65%{transform:translateX(12px)}}@keyframes phase{0%,100%{transform:scale(1)}30%{transform:scale(1.1);filter:drop-shadow(0 0 35px #b41b46)}60%{transform:scale(.96)}}@keyframes deathFade{0%{opacity:1}100%{opacity:0}}@keyframes spawn{0%{opacity:0;transform:translateY(calc(-1px * var(--spawn-rise,14))) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes damage{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-130px)}}
body.demo{background:radial-gradient(circle at center,#383039,#151219)}#demoControls{position:absolute;bottom:10px;right:14px;pointer-events:auto;display:none}body.demo #demoControls{display:block}#demoControls button{padding:9px;margin:2px;background:#9a3040;color:white;border:0;border-radius:7px}
#bonusDock{position:absolute;left:2%;bottom:16%;max-width:none;overflow:hidden;display:flex;flex-direction:column;gap:7px;opacity:.88}#bonusDock .bonus-tile{display:flex;align-items:center;gap:8px;background:#1e1827c9;border:1px solid #886d77a6;border-radius:10px;padding:7px 9px;font:14px Segoe UI,Arial;color:#ffe2c3}#bonusDock .bonus-tile>div{min-width:0;flex:1}#bonusDock .bonus-label,#bonusDock .cost{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#bonusDock img,#bonusDock .bonus-icon-placeholder{width:38px;height:38px;flex:none;object-fit:contain}#bonusDock .bonus-icon-placeholder{display:grid;place-items:center;background:#4d3145;border-radius:7px;color:#ffe1bd}#bonusDock .cost{font-size:11px;color:#efd1a7}#bonusFlash{z-index:150;position:absolute;top:17%;left:50%;transform:translateX(-50%);min-width:210px;max-width:var(--bonus-flash-width,540px);max-height:90%;overflow:hidden;display:none;gap:14px;align-items:center;justify-content:center;padding:15px 24px;background:#211727ef;border:2px solid #e39598;border-radius:17px;box-shadow:0 12px 45px #000c;color:#ffe4dd;font:bold var(--bonus-flash-font,27px) Georgia;text-align:center}#bonusFlash img{width:var(--bonus-flash-icon,90px);height:var(--bonus-flash-icon,90px);flex:none;object-fit:contain}#bonusFlash span{min-width:0;overflow:hidden;text-overflow:ellipsis}#bonusFlash.bonus-visible{display:flex;animation:bonusPop var(--bonus-duration,1600ms) ease both}@keyframes bonusPop{0%{opacity:0;transform:translateX(-50%) scale(.85)}16%,70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(.96)}}#backdrop{position:absolute;inset:0;opacity:0;pointer-events:none;background-size:cover;background-position:center}</style><script src="boss-config.js"></script></head><body><div id="shell"><div id="backdrop"></div><div id="heading"><div id="bossname">Ожидание босса</div><div id="meta">TWITCH RAID BOSS</div></div><div id="notice"></div><img id="bossGhost" class="is-hidden" alt=""><img id="boss" class="is-hidden" alt="Босс"><div id="armor"></div><div id="health" class="is-hidden"><div id="hpbar"></div></div><div id="hptext"></div><div id="top" class="is-hidden"><div id="leaders"></div></div><strong id="topTitle" class="is-hidden">⚔ Топ урона</strong><div id="damage"></div><div id="toast"></div><div id="bonusDock"></div><div id="bonusFlash"></div><div id="connection"></div></div>

<script>
(()=>{
'use strict';let cfg=window.BOSS_STUDIO_4_CONFIG||{bosses:[],websocketUrl:'ws://127.0.0.1:8080/'};const $=id=>document.getElementById(id);let currentFrame=null,lastFrame=null,activeMotion=null,ghostMotion=null,visualTimer=null,bonusFlashTimer=null,spriteVersion='',state=null,boss=null,busy=null,deathHoldTimer=null,deathHideTimer=null,toastTimer=null,queue=[],spriteOverrides={};const query=new URLSearchParams(location.search);const demoMode=query.has('demo'),testMode=query.has('test');if(demoMode)document.body.classList.add('demo');
const DEFAULT_ANIM={spawnFadeMs:900,spawnRisePx:14,hurtMs:350,phaseMs:1900,deathHoldMs:1700,deathFadeMs:1100};
function animCfg(){const src=boss?.animations||{};const out={};for(const [k,def] of Object.entries(DEFAULT_ANIM)){const x=Number(src[k]);out[k]=Number.isFinite(x)&&src[k]!==null?Math.max(0,Math.min(10000,x)):def;}return out;}
function num(v,defaultValue,min,max){const n=Number(v);return Number.isFinite(n)?Math.max(min,Math.min(max,n)):defaultValue;}
function spriteScale(slot){return num(boss?.spriteScales?.[slot],100,30,250)/100;}
function setSprite(slot){
 if(!boss)return;
 const files=boss.sprites||{};
 const key=files[slot]?slot:(files['phase_'+(state?.phase||1)]?'phase_'+(state?.phase||1):'idle');
 const url=files[key]||files.idle||'';
 const node=$('boss');
 if(currentFrame&&currentFrame.url!==url)lastFrame=currentFrame;
 else lastFrame=null;
 const resolved=spriteOverrides[url]||(spriteVersion&&url.startsWith('assets/')?url+'?r='+encodeURIComponent(spriteVersion):url);
 currentFrame={url,src:resolved,scale:spriteScale(key),slot:key};
 node.dataset.path=url;
 if(node.getAttribute('src')!==resolved)node.src=resolved;
 node.style.transform='scale('+currentFrame.scale+')';
}
const DEFAULT_TRANSITIONS={spawn:['fade-up',900,30],attack:['lunge',520,35],hurt:['shake',350,25],phase:['pulse',1900,40],idle:['crossfade',250,20],death:['fade',1100,25]};
function transitionFor(name){let [effect,durationMs,intensity]=DEFAULT_TRANSITIONS[name]||DEFAULT_TRANSITIONS.idle;const o=boss?.visualTransitions?.[name]||{};if(typeof o.effect==='string'&&/^(none|fade|fade-up|crossfade|zoom|zoom-out|slide-left|slide-right|shake|pulse|blur|spin|lunge|sink|flash|wipe)$/.test(o.effect))effect=o.effect;
 return{effect,durationMs:num(o.durationMs,durationMs,0,6000),intensity:num(o.intensity,intensity,0,100)};}
function stopVisualMotion(){if(activeMotion){activeMotion.cancel();activeMotion=null;}if(ghostMotion){ghostMotion.cancel();ghostMotion=null;}if(visualTimer){clearTimeout(visualTimer);visualTimer=null;}const ghost=$('bossGhost');ghost.classList.add('is-hidden');ghost.style.opacity='0';}
function fadeOldFrame(ms){const ghost=$('bossGhost');if(!lastFrame?.src||$('boss').classList.contains('is-hidden'))return;
 ghost.src=lastFrame.src;ghost.style.transform='scale('+lastFrame.scale+')';ghost.style.opacity='1';ghost.classList.remove('is-hidden');
 if(ms<=0){ghost.classList.add('is-hidden');return;}
 ghostMotion=ghost.animate([{opacity:1},{opacity:0}],{duration:ms,easing:'ease-out',fill:'forwards'});
 ghostMotion.onfinish=()=>ghost.classList.add('is-hidden');}
function runTransition(name,isExit=false){const node=$('boss');const t=transitionFor(name);const ms=t.durationMs;const s=currentFrame?.scale||1;const travel=Math.round(t.intensity*1.3);
 if(t.effect==='crossfade'&&!isExit)fadeOldFrame(ms);
 let frames=[{opacity:1,transform:'scale('+s+')'},{opacity:1,transform:'scale('+s+')'}];
 const base='scale('+s+')';
 switch(t.effect){
 case 'fade':case 'crossfade':frames=isExit?[{opacity:1,transform:base},{opacity:0,transform:base}]:[{opacity:0,transform:base},{opacity:1,transform:base}];break;
 case 'fade-up':frames=isExit?[{opacity:1,transform:base},{opacity:0,transform:`translateY(${travel}px) ${base}`}]:[{opacity:0,transform:`translateY(${travel}px) ${base}`},{opacity:1,transform:base}];break;
 case 'zoom':frames=isExit?[{opacity:1,transform:base},{opacity:0,transform:`scale(${(s*1.25).toFixed(3)})`}]:[{opacity:0,transform:`scale(${(s*0.65).toFixed(3)})`},{opacity:1,transform:base}];break;
 case 'zoom-out':frames=isExit?[{opacity:1,transform:base},{opacity:0,transform:`scale(${(s*0.5).toFixed(3)})`}]:[{opacity:0,transform:`scale(${(s*1.25).toFixed(3)})`},{opacity:1,transform:base}];break;
 case 'slide-left':case 'slide-right':{const x=t.effect==='slide-left'?-travel:travel;frames=isExit?[{opacity:1,transform:base},{opacity:0,transform:`translateX(${x}px) ${base}`}]:[{opacity:0,transform:`translateX(${-x}px) ${base}`},{opacity:1,transform:base}];break;}
 case 'sink':frames=isExit?[{opacity:1,transform:base},{opacity:0,transform:`translateY(${travel*2}px) scale(${(s*.84).toFixed(3)})`}]:[{opacity:0,transform:`translateY(${-travel}px) ${base}`},{opacity:1,transform:base}];break;
 case 'blur':frames=isExit?[{opacity:1,filter:'blur(0px)',transform:base},{opacity:0,filter:`blur(${t.intensity/6}px)`,transform:base}]:[{opacity:0,filter:`blur(${t.intensity/6}px)`,transform:base},{opacity:1,filter:'blur(0px)',transform:base}];break;
 case 'wipe':frames=isExit?[{clipPath:'inset(0 0 0 0)',opacity:1,transform:base},{clipPath:'inset(0 100% 0 0)',opacity:0,transform:base}]:[{clipPath:'inset(0 100% 0 0)',opacity:1,transform:base},{clipPath:'inset(0 0 0 0)',opacity:1,transform:base}];break;
 case 'shake':frames=[{transform:base},{transform:`translateX(${-travel}px) ${base}`},{transform:`translateX(${travel}px) ${base}`},{transform:`translateX(${-travel*.5}px) ${base}`},{transform:base}];break;
 case 'pulse':frames=[{transform:base,filter:'brightness(1)'},{transform:`scale(${(s*(1+t.intensity/250)).toFixed(3)})`,filter:'brightness(1.65)'},{transform:`scale(${(s*.96).toFixed(3)})`,filter:'brightness(1.2)'},{transform:base,filter:'brightness(1)'}];break;
 case 'lunge':frames=[{transform:base},{transform:`translateX(${-travel}px) scale(${(s*1.07).toFixed(3)})`},{transform:`translateX(${travel/3}px) ${base}`},{transform:base}];break;
 case 'spin':frames=isExit?[{opacity:1,transform:base},{opacity:0,transform:`rotate(${30+t.intensity*2}deg) scale(${(s*.55).toFixed(3)})`}]:[{opacity:0,transform:`rotate(${-30-t.intensity*2}deg) ${base}`},{opacity:1,transform:base}];break;
 case 'flash':frames=[{opacity:1,filter:'brightness(1)',transform:base},{opacity:.25,filter:'brightness(3)',transform:base},{opacity:1,filter:'brightness(1)',transform:base}];break;
 default:break;
 }
 if(!node.animate||!ms||t.effect==='none'){if(isExit)node.style.opacity='0';return;}
 activeMotion=node.animate(frames,{duration:ms,easing:t.effect==='shake'||t.effect==='pulse'?'ease-in-out':'ease-out',fill:'none'});
 if(isExit)activeMotion.onfinish=()=>{node.style.opacity='0';};
}
function applyStageScale(){const s=num(cfg.overlayStyle?.overallScale,100,50,220)/100;const fit=Math.min(window.innerWidth/3000,window.innerHeight/3000);$('shell').style.transform='translate(-50%,-50%) scale('+(Math.min(1,s)*fit)+')';}
window.addEventListener('resize',applyStageScale);

$('boss').addEventListener('error',()=>{
 const path=$('boss').dataset.path||'(не указан)';
 $('notice').textContent='⚠ Спрайт недоступен: '+path;
});
$('boss').addEventListener('load',()=>{
 if($('notice').textContent.startsWith('⚠ Спрайт недоступен:'))$('notice').textContent='';
});
function cancelAnimation(){if(busy)clearTimeout(busy);if(deathHoldTimer)clearTimeout(deathHoldTimer);if(deathHideTimer)clearTimeout(deathHideTimer);busy=deathHoldTimer=deathHideTimer=null;stopVisualMotion();}
function animate(name){const node=$('boss');cancelAnimation();node.classList.remove('hurt','phase','spawn','death-fade');node.style.opacity='1';node.classList.remove('is-hidden');
 const a=animCfg();
 if(name==='death'){
   // Enter the death sprite smoothly, keep it visible, then play the selected exit effect.
   fadeOldFrame(230);
   const hold=a.deathHoldMs;
   deathHoldTimer=setTimeout(()=>{
     stopVisualMotion();runTransition('death',true);
     deathHideTimer=setTimeout(()=>{node.classList.add('is-hidden');$('health').classList.add('is-hidden');$('top').classList.add('is-hidden');$('topTitle').classList.add('is-hidden');$('armor').textContent='';$('bossname').textContent='БОСС ПОВЕРЖЕН';},Math.max(0,transitionFor('death').durationMs));
   },Math.max(0,hold));return;
 }
 runTransition(name);
 if(name!=='idle'){
   const duration=name==='phase'?a.phaseMs:name==='spawn'?transitionFor('spawn').durationMs:name==='hurt'?Math.max(a.hurtMs,transitionFor('hurt').durationMs):transitionFor(name).durationMs;
   busy=setTimeout(()=>{busy=null;if(!state||!state.active)return;setSprite(state.phase===3?'phase_3':state.phase===2?'phase_2':'idle');animate('idle');},Math.max(0,duration));
 }
}
function toastNotice(text,image=''){queue.push({text,image});if(queue.length>15)queue.shift();if(toastTimer)return;nextToast()}
function nextToast(){if(!queue.length){toastTimer=null;$('toast').style.opacity=0;return}const entry=queue.shift(),box=$('toast');box.replaceChildren();if(entry.image){const img=document.createElement('img');img.src=entry.image;img.alt='';img.style.cssText='display:block;width:80px;height:80px;object-fit:contain;margin:0 auto 9px';box.append(img)}const caption=document.createElement('span');caption.textContent='✦ '+entry.text;box.append(caption);box.style.opacity=1;toastTimer=setTimeout(()=>{box.style.opacity=0;toastTimer=setTimeout(()=>{toastTimer=null;nextToast()},400)},2800)}
const TEXT_DEFAULTS={bossName:{font:'Georgia',scale:100,bold:true,italic:false,underline:false,color:'#f9f0df'},phase:{font:'Segoe UI',scale:100,bold:false,italic:false,underline:false,color:'#dcc79e'},topTitle:{font:'Segoe UI',scale:100,bold:true,italic:false,underline:false,color:'#e8c18a'},hp:{font:'Arial',scale:100,bold:true,italic:false,underline:false,color:'#ffffff'},notice:{font:'Georgia',scale:100,bold:true,italic:false,underline:false,color:'#f9f0df'},topRows:{font:'Segoe UI',scale:100,bold:false,italic:false,underline:false,color:'#f9f0df'},armor:{font:'Segoe UI',scale:100,bold:true,italic:false,underline:false,color:'#b7d6e7'},bonusText:{font:'Segoe UI',scale:100,bold:true,italic:false,underline:false,color:'#ffe2c3'},bonusCost:{font:'Segoe UI',scale:100,bold:false,italic:false,underline:false,color:'#efd1a7'}};
const SAFE_FONTS=['Georgia','Segoe UI','Arial','Verdana','Trebuchet MS','Tahoma','Impact','Courier New','Times New Roman'];
function applyType(node,key,base,d){
 const fallback={...TEXT_DEFAULTS[key],scale:key==='bossName'?Number(d.fontScale)||100:100};
 const t={...fallback,...(d.typography?.[key]||{})};
 const font=SAFE_FONTS.includes(t.font)?t.font:fallback.font;
 const scale=Math.max(10,Math.min(10000,Number(t.scale)||100));
 node.style.fontFamily='"'+font.replaceAll('"','')+'", sans-serif';
 node.style.fontSize=Math.round(base*scale/100)+'px';
 node.style.fontWeight=t.bold?'700':'400';
 node.style.fontStyle=t.italic?'italic':'normal';
 node.style.textDecoration=t.underline?'underline':'none';
 node.style.color=/^#[0-9a-fA-F]{6}$/.test(t.color)?t.color:fallback.color;
 return scale;
}

const STAGE=3000,BOX_DEFAULTS={boss:{x:690,y:450,w:1620,h:2220},bossName:{x:450,y:60,w:2100,h:120},phase:{x:450,y:180,w:2100,h:70},health:{x:720,y:2760,w:1560,h:50},hpText:{x:720,y:2760,w:1560,h:50},armor:{x:720,y:2650,w:900,h:70},top:{x:2340,y:1050,w:600,h:600},topTitle:{x:2356,y:1060,w:568,h:75},notice:{x:810,y:600,w:1380,h:180},bonusDock:{x:60,y:2100,w:360,h:600}};
function layoutNum(v,def,min,max){const n=Number(v);return Number.isFinite(n)?Math.max(min,Math.min(max,Math.round(n))):def;}
function boxFor(key,layout){const d=BOX_DEFAULTS[key],raw=layout[key]||{},w=layoutNum(raw.w,d.w,120,STAGE),h=layoutNum(raw.h,d.h,30,STAGE);return{x:layoutNum(raw.x,d.x,0,STAGE-w),y:layoutNum(raw.y,d.y,0,STAGE-h),w,h};}
function fitOne(node,desiredSize,heightLimit){
 const content=node.textContent||'',boxWidth=node.clientWidth;
 if(!content||boxWidth<=0||heightLimit<=0)return;
 const css=getComputedStyle(node);
 // Measure actual browser glyphs, including font fallback and letter spacing.
 const probe=fitOne.probe||(fitOne.probe=document.createElement('span'));
 if(!probe.isConnected){Object.assign(probe.style,{position:'fixed',left:'-10000px',top:'-10000px',visibility:'hidden',display:'inline-block',whiteSpace:'pre',pointerEvents:'none',lineHeight:'normal'});document.body.append(probe)}
 Object.assign(probe.style,{fontFamily:css.fontFamily,fontWeight:css.fontWeight,fontStyle:css.fontStyle,fontVariant:css.fontVariant,letterSpacing:node.id==='bossname'?'.03em':css.letterSpacing});
 probe.textContent=content;
 const widthLimit=Math.max(1,boxWidth*.90-12),verticalLimit=Math.max(1,heightLimit*.90);
 let low=1,high=Math.max(1,Math.min(STAGE,desiredSize));
 for(let i=0;i<19;i++){
  const mid=(low+high)/2;probe.style.fontSize=mid+'px';const bounds=probe.getBoundingClientRect();
  if(bounds.width<=widthLimit&&bounds.height<=verticalLimit)low=mid;else high=mid;
 }
 node.style.fontSize=Math.max(1,Math.floor(low))+'px';
}
function applyLayout(){
 const style=cfg.overlayStyle||{},layout={...(style.layout||{})};
 if(!layout.topTitle&&layout.top)layout.topTitle={x:(Number(layout.top.x)||2340)+16,y:(Number(layout.top.y)||1050)+10,w:Math.max(120,(Number(layout.top.w)||600)-32),h:75};
 if(!layout.bossName&&layout.heading)layout.bossName=layout.heading;
 if(!layout.phase&&layout.heading)layout.phase={...layout.heading,y:(Number(layout.heading.y)||60)+120};
 if(!layout.hpText&&layout.health)layout.hpText=layout.health;
 if(layout.health&&!('h' in layout.health)&&style.hpBarScale)layout.health={...layout.health,h:Math.round(50*num(style.hpBarScale,100,50,400)/100)};
 if(layout.hpText&&!('h' in layout.hpText)&&style.hpBarScale)layout.hpText={...layout.hpText,h:Math.round(50*num(style.hpBarScale,100,50,400)/100)};
 for(const key of Object.keys(BOX_DEFAULTS)){
  const id=key==='bossName'?'bossname':key==='phase'?'meta':key==='hpText'?'hptext':key;
  const node=$(id),box=boxFor(key,layout);
  Object.assign(node.style,{left:box.x+'px',top:box.y+'px',bottom:'auto',right:'auto',width:box.w+'px',height:box.h+'px',maxHeight:box.h+'px'});
  if(key==='boss'){const ghost=$('bossGhost');Object.assign(ghost.style,{left:box.x+'px',top:box.y+'px',bottom:'auto',right:'auto',width:box.w+'px',height:box.h+'px'});}
 }
 const order=Array.isArray(style.layerOrder)?style.layerOrder:[];const layers=[...new Set(order.filter(k=>Object.hasOwn(BOX_DEFAULTS,k)).concat(Object.keys(BOX_DEFAULTS)))];
 for(const [i,key] of layers.entries()){const node=$(key==='bossName'?'bossname':key==='phase'?'meta':key==='hpText'?'hptext':key);node.style.zIndex=String(10+i);if(key==='boss')$('bossGhost').style.zIndex=String(10+i)}
 sizeScoreboard(style,layout);sizeBonusDock(style,layout);const armor=$('armor'),armorBox=boxFor('armor',layout);fitOne(armor,armorBox.h*17/70*num(style.typography?.armor?.scale,100,10,10000)/100,armorBox.h-4);
 const hp=$('hptext'),hpBox=boxFor('hpText',layout);hp.style.lineHeight=hpBox.h+'px';
 for(const [id,key,boxKey,base,defaultHeight,heightRatio] of [
  ['bossname','bossName','bossName',90,120,1],['meta','phase','phase',30,70,1],
  ['hptext','hp','hpText',36,50,1],['topTitle','topTitle','topTitle',34,75,1],
  ['notice','notice','notice',56,180,1]]){
  const node=$(id),box=boxFor(boxKey,layout);
  const scale=num(style.typography?.[key]?.scale,100,10,10000)/100;
  fitOne(node,box.h*base/defaultHeight*scale,box.h*heightRatio-4);
 }
}
function applyDesign(){applyStageScale();const d=cfg.overlayStyle||{};const bg=$('backdrop');bg.style.backgroundColor=d.backgroundColor||'#16131e';bg.style.opacity=(Math.max(0,Math.min(100,Number(d.backgroundOpacity)||0))/100);$('hpbar').style.background=d.hpColor||'#e45a67';const flashScale=num(d.bonusFlashScale,100,50,800)/100,flash=$('bonusFlash');flash.style.setProperty('--bonus-flash-font',Math.round(27*flashScale)+'px');flash.style.setProperty('--bonus-flash-icon',Math.round(90*flashScale)+'px');flash.style.setProperty('--bonus-flash-width',Math.min(2700,Math.round(540*flashScale))+'px');$('top').style.backgroundColor='rgba(24,23,28,'+(Math.max(0,Math.min(100,d.topOpacity==null?82:Number(d.topOpacity)))/100)+')';$('topTitle').textContent=d.topTitle||'⚔ Топ урона';
 applyType($('bossname'),'bossName',46,d);
 applyType($('meta'),'phase',15,d);
 applyType($('topTitle'),'topTitle',17,d);
 applyType($('hptext'),'hp',18,d);
 applyType($('notice'),'notice',29,d);applyType($('armor'),'armor',17,d);
 if(d.topVisible===false){$('top').classList.add('is-hidden');$('topTitle').classList.add('is-hidden')}applyLayout();}
function sizeScoreboard(style,layout){
 const panel=boxFor('top',layout),rows=[...$('leaders').querySelectorAll('.score')],fontScale=num(style.typography?.topRows?.scale,100,10,10000)/100;
 const availableHeight=Math.max(24,(panel.h-110)/Math.max(1,rows.length)),desired=17*panel.w/600*fontScale;
 for(const row of rows)for(const node of row.children){applyType(node,'topRows',17,style);fitOne(node,desired,availableHeight*.85)}
}
function sizeBonusDock(style,layout){
 const box=boxFor('bonusDock',layout),rows=[...$('bonusDock').querySelectorAll('.bonus-tile')],rowHeight=Math.max(30,box.h/Math.max(1,rows.length));
 const iconScale=num(style.bonusIconScale,100,50,800)/100;
 for(const row of rows){
  const icon=row.querySelector('img,.bonus-icon-placeholder');if(icon){const base=num(row.dataset.iconSize,38,24,160);const size=Math.round(Math.min(rowHeight*.72,box.w*.42,base*box.w/360*iconScale));icon.style.width=size+'px';icon.style.height=size+'px';if(icon.classList.contains('bonus-icon-placeholder'))icon.style.fontSize=Math.round(size*.65)+'px'}
  for(const [selector,key,base] of [['.bonus-label','bonusText',14],['.cost','bonusCost',11]]){
   const node=row.querySelector(selector);if(!node)continue;applyType(node,key,base,style);
   const desired=base*box.w/360*num(style.typography?.[key]?.scale,100,10,10000)/100;
   fitOne(node,desired,rowHeight*.38);
  }
 }
}
function renderBonusDock(){const dock=$('bonusDock');dock.replaceChildren();(cfg.bonuses||[]).filter(b=>b.enabled!==false).slice(0,5).forEach(b=>{const row=document.createElement('div');row.className='bonus-tile';if(b.icon){const pic=document.createElement('img');pic.alt='';pic.src=b.icon+'?v='+encodeURIComponent(spriteVersion);row.append(pic)}else{const icon=document.createElement('span');icon.className='bonus-icon-placeholder';icon.textContent='✦';row.append(icon)}const caption=document.createElement('div');const label=document.createElement('div');label.className='bonus-label';label.textContent=b.name;const price=document.createElement('div');price.className='cost';price.textContent=(b.cost||1)+' баллов Twitch';caption.append(label,price);row.append(caption);row.dataset.iconSize=String(b.iconSize||38);dock.append(row);});}
function bonusFlash(data){if(!data.bonusId)return;const el=$('bonusFlash');if(bonusFlashTimer)clearTimeout(bonusFlashTimer);el.replaceChildren();const b=(cfg.bonuses||[]).find(x=>x.id===data.bonusId);if(data.bonusIcon||b?.icon){const im=document.createElement('img');im.src=(data.bonusIcon||b.icon)+'?v='+encodeURIComponent(spriteVersion);im.alt='';el.append(im)}const span=document.createElement('span');span.textContent=(data.player||'Зритель')+' — '+(data.bonusName||b?.name||'Бонус');el.append(span);el.style.setProperty('--bonus-duration',Math.max(300,Math.min(10000,Number(data.bonusAnimationMs)||1600))+'ms');el.classList.remove('bonus-visible');void el.offsetWidth;el.classList.add('bonus-visible');bonusFlashTimer=setTimeout(()=>el.classList.remove('bonus-visible'),Math.max(300,Math.min(10000,Number(data.bonusAnimationMs)||1600)));}
function formattedText(key,fallback,values){const template=cfg.overlayStyle?.textTemplates?.[key];return String(template==null?fallback:template).replace(/\{([a-zA-Z]+)\}/g,(all,k)=>Object.hasOwn(values,k)?String(values[k]):all)}
function message(data){if(!data||data.kind!=='boss-studio4')return;state=data;boss=cfg.bosses.find(x=>x.id===data.bossId);const hasBoss=!!boss;$('boss').classList.toggle('is-hidden',!hasBoss);$('health').classList.toggle('is-hidden',!hasBoss);$('top').classList.toggle('is-hidden',!hasBoss||cfg.overlayStyle?.topVisible===false);$('topTitle').classList.toggle('is-hidden',!hasBoss||cfg.overlayStyle?.topVisible===false);$('bossname').textContent=hasBoss?formattedText('bossName','{boss}',{boss:boss.name}):'Ожидание босса';$('meta').textContent=hasBoss?formattedText('phase','ФАЗА {phase} · {rarity}',{phase:data.phase,rarity:String(boss.rarity||'').toUpperCase()}):'TWITCH RAID BOSS';if(!hasBoss)return;
$('hpbar').style.width=(Math.max(0,Math.min(1,data.hp/Math.max(1,data.maxHp)))*100)+'%';$('hptext').textContent=formattedText('hpText','{hp} / {maxHp} HP',{hp:data.hp.toLocaleString('ru-RU'),maxHp:data.maxHp.toLocaleString('ru-RU')});$('armor').textContent=data.armor>0?formattedText('armor','🛡 Броня {armor}',{armor:data.armor}):'';
const leaders=$('leaders');leaders.replaceChildren();(data.leaderboard||[]).forEach((e,i)=>{const r=document.createElement('div');r.className='score';const n=document.createElement('span');n.textContent=(i+1)+'. '+String(e.name);const v=document.createElement('b');v.textContent=Number(e.damage).toLocaleString('ru-RU');r.append(n,v);leaders.append(r)});sizeScoreboard(cfg.overlayStyle||{},cfg.overlayStyle?.layout||{});
$('notice').textContent=data.curseActive?formattedText('notice','⚠ ПРОКЛЯТИЕ — !щит ({guards}/{requiredGuards})',{guards:data.guards,requiredGuards:data.requiredGuards}):'';
applyLayout();if(data.bonusId&&data.action!=='sync')bonusFlash(data);
if(data.action==='trophy'){toastNotice((data.player||'Зритель')+' получил трофей');return}
if(data.action==='sync'&&!data.active){cancelAnimation();$('boss').classList.add('is-hidden');$('health').classList.add('is-hidden');$('top').classList.add('is-hidden');$('topTitle').classList.add('is-hidden');return;}
if(data.action==='reset'){cancelAnimation();currentFrame=null;lastFrame=null;$('boss').classList.remove('hurt','phase','spawn','death-fade');$('boss').classList.add('is-hidden');$('health').classList.add('is-hidden');$('top').classList.add('is-hidden');$('topTitle').classList.add('is-hidden');$('bossname').textContent='Ожидание босса';return}
if(data.action==='death'){setSprite('death');animate('death');const trophy=cfg.bosses?.find(b=>b.id===data.bossId)?.trophy||{};toastNotice('БОСС ПОВЕРЖЕН!'+(data.leaderboard?.length?' '+(trophy.name||'Трофей')+' участникам.':''),(spriteOverrides[trophy.image]||trophy.image||''));return}
if(data.action==='spawn'){setSprite('idle');animate('spawn');return}
if(data.action==='phase'){setSprite('phase_change');animate('phase');return}
if(data.action==='curse'||data.action==='attack'||data.action==='boss_attack'){setSprite('attack');animate('attack');return}
if(data.action==='bonus'){setSprite(data.phase===3?'phase_3':data.phase===2?'phase_2':'idle');return}
if(data.action==='hurt'||['bits','donation','follow','sub','resub','giftsub','reward'].includes(data.action)){setSprite('hurt');animate('hurt');const n=$('damage');n.textContent='−'+data.damage;n.classList.remove('damage');void n.offsetWidth;n.classList.add('damage');return}
setSprite(data.phase===3?'phase_3':data.phase===2?'phase_2':'idle');
}
function connect(){const ws=new WebSocket(cfg.websocketUrl||'ws://127.0.0.1:8080/');$('connection').textContent='● Подключение к Streamer.bot…';ws.onopen=()=>{$('connection').textContent='● Streamer.bot: подключено';try{ws.send(JSON.stringify({request:'Subscribe',events:{General:['Custom']},id:'boss4'}));ws.send(JSON.stringify({request:'GetActions',id:'boss4-restore-actions'}));}catch{}};ws.onmessage=e=>{let data;try{data=JSON.parse(e.data)}catch{return}
if(data.id==='boss4-restore-actions'&&Array.isArray(data.actions)){const actionName=cfg.syncActionName||'BossStudio RPG';const action=data.actions.find(a=>a.enabled!==false&&a.name===actionName);if(action)try{ws.send(JSON.stringify({request:'DoAction',action:{id:action.id},args:{bossEventType:'sync'},id:'boss4-restore-current'}));}catch{}return;}
if(data?.event?.source==='General'&&data.event.type==='Custom'){try{message(JSON.parse(data.data?.data))}catch{}}else{message(data)}};ws.onclose=()=>{$('connection').textContent='○ Streamer.bot: нет соединения';setTimeout(connect,3000)};ws.onerror=()=>ws.close()}
window.demo=function(action){let b=cfg.bosses[0];if(action==='swap')b=cfg.bosses[1]||b;let maxHp=b.hp||10000;let phase=action==='phase'?2:action==='death'?3:1;let hp=action==='death'?0:action==='phase'?Math.round(maxHp*.65):action==='hurt'?Math.round(maxHp*.9):maxHp;message({kind:'boss-studio4',action:action==='swap'?'spawn':action,active:action!=='death',bossId:b.id,bossName:b.name,hp,maxHp,armor:action==='phase'?600:250,phase,player:'Зритель',damage:420,leaderboard:[{name:'Viewer1',damage:1200},{name:'Viewer2',damage:875}]})};
window.addEventListener('message', e=>{const d=e.data;if(!d||!d.bs41)return;if(d.bs41==='config'&&d.config){cfg=d.config;renderBonusDock();applyDesign();spriteOverrides=d.overrides||{};$('connection').textContent='◉ ПОЛИГОН: без реального Twitch';}if(d.bs41==='battle')message(d.data);});
// Live deployment is served by the local bridge. Never poll in the offline editor/test iframe.
let liveRevision=null;
async function refreshLiveConfig(){
 if(testMode||!location.pathname.startsWith('/live/'))return;
 try{
  const response=await fetch('/api/version',{cache:'no-store'});
  if(!response.ok)return;
  const rev=(await response.json()).version;
  if(!rev)return;
  if(liveRevision===null){liveRevision=rev;spriteVersion=rev;return;}
  if(liveRevision===rev)return;
  const cResponse=await fetch('/api/live-config',{cache:'no-store'});
  if(!cResponse.ok)return;
  const next=await cResponse.json();
  if(!Array.isArray(next.bosses))return;
  const oldWs=cfg.websocketUrl;
  cfg=next;spriteVersion=rev;liveRevision=rev;renderBonusDock();applyDesign();
  if(state){boss=cfg.bosses.find(b=>b.id===state.bossId)||null;if(boss){
    message(Object.assign({},state,{action:'sync'}));
  }else{cancelAnimation();$('boss').classList.add('is-hidden');$('health').classList.add('is-hidden');$('top').classList.add('is-hidden');$('topTitle').classList.add('is-hidden');$('armor').textContent='';$('bossname').textContent='БОСС ВНЕ ВЫБРАННОГО НАБОРА';$('notice').textContent='Конфигурация обновлена. Активный босс отсутствует в выбранном наборе.';}}
  if(oldWs!==cfg.websocketUrl)location.reload();
  $('connection').textContent='● Boss Studio: база обновлена';
 }catch(e){/* bridge may be momentarily unavailable; keep last config */}
}
if(!testMode&&location.pathname.startsWith('/live/'))setInterval(refreshLiveConfig,2500);
const easyParams=new URLSearchParams(location.search);const easyMode=easyParams.get('easy')==='1';const easyTest=easyParams.get('mode')==='test';
renderBonusDock();applyDesign();
if(easyMode){
  let lastSeq=-1;
  async function easyPoll(){try{
    const r=await fetch(easyTest?'/api/easy/test-state':'/api/easy/state',{cache:'no-store'});if(!r.ok)throw Error();
    const data=await r.json();
    if(data.seq!==lastSeq){let first=lastSeq<0;lastSeq=data.seq;message(first?Object.assign({},data,{action:'sync'}):data);}
    $('connection').textContent=easyTest?'◉ Тестовый бой':'● Boss Studio Easy: подключено';
   }catch(e){$('connection').textContent='○ Boss Studio Easy: нет связи';}}
  easyPoll();setInterval(easyPoll,450);
}else if(!testMode)connect();else $('connection').textContent='◉ ПОЛИГОН: без реального Twitch';if(demoMode)demo('spawn');
})();
</script></body></html>
